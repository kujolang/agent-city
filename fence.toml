version = 1
source_roots = ["packages", "apps", "integrations"]
default_severity = "error"
fail_on = "error"
unknown_dependency_policy = "allow"
[scan]
exclude = ["node_modules/**", "dist/**", ".runtime/**", "**/generated.ts"]
[zones.protocol]
paths = ["packages/protocol/**"]
cannot_depend_on = ["world", "renderer", "gateway", "web", "integration"]
[zones.world]
paths = ["packages/world-core/**"]
can_depend_on = ["protocol"]
cannot_depend_on = ["renderer", "gateway", "web", "integration"]
external_deny = ["pixi.js", "node:*"]
[zones.renderer]
paths = ["packages/renderer-pixi/**"]
can_depend_on = ["world", "protocol"]
cannot_depend_on = ["gateway", "web", "integration"]
[zones.gateway]
paths = ["apps/gateway/**"]
can_depend_on = ["protocol", "world", "integration"]
cannot_depend_on = ["renderer", "web"]
[zones.web]
paths = ["apps/web/**"]
can_depend_on = ["protocol", "world", "renderer"]
cannot_depend_on = ["gateway", "integration"]
[zones.integration]
paths = ["integrations/**"]
can_depend_on = ["protocol"]
cannot_depend_on = ["renderer", "web", "world"]
