name: Bounded VideoOps render qualification
on:
  workflow_dispatch:
    inputs:
      model_editor:
        description: Render the checked-in real SDK Editor output instead of the controlled fixture
        type: boolean
        default: false
      editor_attempt:
        description: Immutable real Editor attempt to qualify
        type: choice
        options: ["1", "2"]
        default: "1"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned local render image
        run: docker build --tag agent-city-videoops:0.8.141 installer/videoops
      - name: Install pinned application and producer dependencies
        env:
          CITY_INSTALL_REF: ${{ github.sha }}
        run: sh install.sh --prefix "$RUNNER_TEMP/city" --no-start
      - name: Saved VideoOps setup qualification (no model calls)
        env:
          CITY_VIDEOOPS_PROOF_OUTPUT: ${{ runner.temp }}/videoops-proof
        run: |
          cd "$RUNNER_TEMP/city/agent-city"
          if [ -x ../.node/bin/node ]; then export PATH="$RUNNER_TEMP/city/.node/bin:$PATH"; fi
          mkdir -p .runtime/control "$CITY_VIDEOOPS_PROOF_OUTPUT"
          node --input-type=module -e 'import fs from "node:fs";fs.writeFileSync(".runtime/control/model.json",JSON.stringify({endpoint:"http://127.0.0.1:1/v1/chat/completions",model:"setup-fixture-not-invoked",apiKey:""}),{mode:384});'
          image_id="$(docker image inspect agent-city-videoops:0.8.141 --format '{{.Id}}')"
          npm run setup:videoops -- --image "$image_id" --enable --confirm-model-capabilities
          cp .runtime/videoops-setup-evidence.json "$CITY_VIDEOOPS_PROOF_OUTPUT/setup.json"
          node --import tsx --input-type=module -e 'import assert from "node:assert/strict";import {videoopsLaunchEnv} from "./apps/runner/videoops-settings.ts";const env=await videoopsLaunchEnv(process.cwd()+"/.runtime",{});assert(env.CITY_VIDEOOPS_CONFIG);'
          npm run setup:videoops -- --disable
          node --import tsx --input-type=module -e 'import assert from "node:assert/strict";import {videoopsLaunchEnv} from "./apps/runner/videoops-settings.ts";assert.equal((await videoopsLaunchEnv(process.cwd()+"/.runtime",{})).CITY_VIDEOOPS_CONFIG,undefined);'
      - name: Supply exact checked-out model evidence to installed proof
        if: inputs.model_editor
        run: |
          mkdir -p "$RUNNER_TEMP/city/agent-city/evidence/videoops-model-editor"
          cp -R evidence/videoops-model-editor/. "$RUNNER_TEMP/city/agent-city/evidence/videoops-model-editor/"
      - name: Actual network-disabled Workcell render
        env:
          CITY_VIDEOOPS_EDITOR_ATTEMPT: ${{ inputs.editor_attempt }}
          CITY_VIDEOOPS_MODEL_PROOF: ${{ inputs.model_editor && '1' || '0' }}
          CITY_VIDEOOPS_PROOF_OUTPUT: ${{ runner.temp }}/videoops-proof
        run: |
          cd "$RUNNER_TEMP/city/agent-city"
          if [ -x ../.node/bin/node ]; then export PATH="$RUNNER_TEMP/city/.node/bin:$PATH"; fi
          export CITY_VIDEOOPS_IMAGE="$(docker image inspect agent-city-videoops:0.8.141 --format '{{.Id}}')"
          npx tsx scripts/videoops-render-proof.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videoops-render-proof
          path: ${{ runner.temp }}/videoops-proof
          if-no-files-found: warn
