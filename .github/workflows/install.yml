name: Isolated installation
on:
  push:
    branches: [main]
    paths: ["installer/**", "install.sh", "apps/**", "packages/**", "assets/**", "integrations/**", "scripts/**", "tests/**", "tsconfig.json", "vitest.config.ts", "package*.json", ".github/workflows/install.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify source types, package boundaries, maps, tests and build
        run: npm run verify
      - name: Install controlled browser
        run: npx playwright install --with-deps chromium
      - name: Verify onboarding faults and fullscreen presentation without model calls
        run: |
          node --import tsx scripts/provider-setup-proof.ts
          node --import tsx scripts/game-view-proof.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-browser-acceptance
          path: |
            evidence/provider-setup-faults
            evidence/game-view
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Public bootstrap with private Node and pinned producer repositories
        env:
          CITY_INSTALL_REF: ${{ github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/no-system-node"
          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/no-system-node/node"
          chmod +x "$RUNNER_TEMP/no-system-node/node"
          PATH="$RUNNER_TEMP/no-system-node:$PATH" sh install.sh --prefix "$RUNNER_TEMP/city" --no-start
          test -x "$RUNNER_TEMP/city/.node/bin/node"
          test -s "$RUNNER_TEMP/city/agent-city/TRY-AGENT-CITY.md"
          test -s "$RUNNER_TEMP/city/agent-city/WORKING-EXPERIENCE.md"
          test -s "$RUNNER_TEMP/city/agent-city/RELEASE-CHECKLIST.md"
      - name: Verify managed setup without system Node or npm
        run: |
          printf '#!/bin/sh\nexit 73\n' > "$RUNNER_TEMP/no-system-node/npm"
          chmod +x "$RUNNER_TEMP/no-system-node/npm"
          PATH="$RUNNER_TEMP/no-system-node:/usr/bin:/bin" "$RUNNER_TEMP/city/start.command" doctor --json > "$RUNNER_TEMP/launcher-doctor.log"
          PATH="$RUNNER_TEMP/no-system-node:/usr/bin:/bin" "$RUNNER_TEMP/city/start.command" --help > "$RUNNER_TEMP/launcher-help.log"
      - name: Import pinned profiles without another checkout or system npm
        run: |
          PATH="$RUNNER_TEMP/no-system-node:/usr/bin:/bin" "$RUNNER_TEMP/city/start.command" agents:import > "$RUNNER_TEMP/catalog-import.log"
          cd "$RUNNER_TEMP/city/agent-city"
          "$RUNNER_TEMP/city/.node/bin/node" --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const registry=JSON.parse(await readFile('../kujo-agents/agent-registry.json','utf8'));
          const catalog=JSON.parse(await readFile('.runtime/control/agent-catalog.json','utf8'));
          assert.equal(catalog.profiles.length, registry.agents.length);
          assert(catalog.profiles.length > 0);
          console.log(JSON.stringify({profiles:catalog.profiles.length,scope:'Pinned contract import only; no model, grants, or executions'}));
          JS
      - name: Verify actual installed SDK, Dispatch, RAG and MCP contracts
        run: cd "$RUNNER_TEMP/city/agent-city" && "$RUNNER_TEMP/city/.node/bin/node" --import tsx scripts/mission-contract.ts
      - name: Verify supervisor loss preserves the actual mission outcome
        run: cd "$RUNNER_TEMP/city/agent-city" && "$RUNNER_TEMP/city/.node/bin/node" --import tsx scripts/supervisor-loss-proof.ts
      - name: Verify real installed update, refusal and archive lifecycle
        env:
          CITY_OWNED_TEST_INSTALL: ${{ runner.temp }}/city
          CITY_MAINTENANCE_PROOF: ${{ runner.temp }}/maintenance.json
        run: '"$RUNNER_TEMP/city/.node/bin/node" scripts/installed-maintenance-proof.mjs'
      - name: Start and verify the owned CI sandbox engine
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start docker
          timeout 30 docker info --format '{{json .ServerVersion}}' > "$RUNNER_TEMP/docker-readiness.log"
      - name: Build pinned local sandbox image and verify installed Workcell
        if: runner.os == 'Linux'
        env:
          CITY_CI_WORKCELL_PROOF: "1"
          CITY_WORKCELL_PROOF_OUTPUT: ${{ runner.temp }}/workcell-platform.json
        run: |
          export PATH="$RUNNER_TEMP/city/.node/bin:$PATH"
          cd "$RUNNER_TEMP/city/agent-city"
          "$RUNNER_TEMP/city/start.command" setup:workcell --build
          node --import tsx scripts/installed-workcell-proof.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/launcher-doctor.log
            ${{ runner.temp }}/launcher-help.log
            ${{ runner.temp }}/catalog-import.log
            ${{ runner.temp }}/docker-readiness.log
            ${{ runner.temp }}/workcell-platform.json
            ${{ runner.temp }}/maintenance.json
            ${{ runner.temp }}/city/install-receipt.json
            ${{ runner.temp }}/city/agent-city/evidence/missions/contract.json
            ${{ runner.temp }}/city/agent-city/evidence/supervisor-loss/proof.json
