name: Isolated installation
on:
  push:
    branches: [main]
    paths: ["installer/**", "install.sh", "apps/**", "packages/**", "integrations/**", "scripts/**", "package*.json", ".github/workflows/install.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Public bootstrap with private Node and pinned producer repositories
        env:
          CITY_INSTALL_REF: ${{ github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/no-system-node"
          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/no-system-node/node"
          chmod +x "$RUNNER_TEMP/no-system-node/node"
          PATH="$RUNNER_TEMP/no-system-node:$PATH" sh install.sh --prefix "$RUNNER_TEMP/city" --no-start
          test -x "$RUNNER_TEMP/city/.node/bin/node"
      - name: Verify managed setup without system Node or npm
        run: |
          printf '#!/bin/sh\nexit 73\n' > "$RUNNER_TEMP/no-system-node/npm"
          chmod +x "$RUNNER_TEMP/no-system-node/npm"
          PATH="$RUNNER_TEMP/no-system-node:/usr/bin:/bin" "$RUNNER_TEMP/city/start.command" doctor --json > "$RUNNER_TEMP/launcher-doctor.log"
          PATH="$RUNNER_TEMP/no-system-node:/usr/bin:/bin" "$RUNNER_TEMP/city/start.command" --help > "$RUNNER_TEMP/launcher-help.log"
      - name: Verify actual installed SDK, Dispatch, RAG and MCP contracts
        run: cd "$RUNNER_TEMP/city/agent-city" && "$RUNNER_TEMP/city/.node/bin/node" --import tsx scripts/mission-contract.ts
      - name: Verify real installed update, refusal and archive lifecycle
        env:
          CITY_OWNED_TEST_INSTALL: ${{ runner.temp }}/city
          CITY_MAINTENANCE_PROOF: ${{ runner.temp }}/maintenance.json
        run: '"$RUNNER_TEMP/city/.node/bin/node" scripts/installed-maintenance-proof.mjs'
      - name: Build pinned local sandbox image and verify installed Workcell
        if: runner.os == 'Linux'
        env:
          CITY_CI_WORKCELL_PROOF: "1"
          CITY_WORKCELL_PROOF_OUTPUT: ${{ runner.temp }}/workcell-platform.json
        run: |
          export PATH="$RUNNER_TEMP/city/.node/bin:$PATH"
          cd "$RUNNER_TEMP/city/agent-city"
          "$RUNNER_TEMP/city/start.command" setup:workcell --build
          node --import tsx scripts/installed-workcell-proof.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/launcher-doctor.log
            ${{ runner.temp }}/launcher-help.log
            ${{ runner.temp }}/workcell-platform.json
            ${{ runner.temp }}/maintenance.json
            ${{ runner.temp }}/city/install-receipt.json
            ${{ runner.temp }}/city/agent-city/evidence/missions/contract.json
